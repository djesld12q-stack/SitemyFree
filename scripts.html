<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мої скрипти</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #9146FF; --bg: #07070f; --bg3: #121220; --bg4: #181830;
      --text: #eeeef8; --muted: #6e6e90; --border: rgba(145,70,255,.18);
    }
    body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: linear-gradient(rgba(145,70,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(145,70,255,.04) 1px, transparent 1px);
      background-size: 44px 44px; pointer-events: none; z-index: 0;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px; height: 56px;
      background: rgba(7,7,15,.96); border-bottom: 1px solid var(--border); backdrop-filter: blur(14px);
    }
    .nav-logo { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 4px; color: var(--accent); text-decoration: none; }
    .nav-links { display: flex; gap: 24px; }
    .nav-links a { font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color .2s; padding-bottom: 2px; border-bottom: 2px solid transparent; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.active { color: var(--accent); border-bottom-color: var(--accent); }

    .page { position: relative; z-index: 1; max-width: 920px; margin: 0 auto; padding: 100px 24px 60px; }
    .section-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 3px; color: var(--accent); margin-bottom: 4px; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 5px; margin-bottom: 28px; }

    .scripts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }

    .script-card {
      background: var(--bg4); border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; transition: transform .2s, border-color .2s, box-shadow .2s;
      display: flex; flex-direction: column;
    }
    .script-card:hover { transform: translateY(-4px); border-color: rgba(145,70,255,.45); box-shadow: 0 12px 40px rgba(145,70,255,.2); }

    .script-card img {
      width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block;
      background: var(--bg3);
    }

    .script-card-body {
      padding: 14px 16px 16px;
      display: flex; flex-direction: column; gap: 10px; flex: 1;
    }

    .script-card-header {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }

    .script-name { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; color: var(--text); }

    /* ── опис ── */
    .script-desc {
      font-family: 'Rajdhani', sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.55;
      color: var(--muted);
      border-left: 2px solid rgba(145,70,255,.35);
      padding-left: 10px;
    }

    .script-dl {
      display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
      background: var(--accent); color: #fff;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 1px;
      padding: 7px 14px; border-radius: 3px; text-decoration: none;
      transition: opacity .2s, transform .15s;
      box-shadow: 0 0 14px rgba(145,70,255,.3);
    }
    .script-dl:hover { opacity: .85; transform: scale(1.04); }

    footer { position: relative; z-index: 1; border-top: 1px solid var(--border); padding: 28px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 60px; }
    footer strong { color: var(--accent); }

    /* ── BURGER MOBILE MENU ── */
    .burger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; background: none; border: none; z-index: 300; }
    .burger span { display: block; width: 24px; height: 2px; background: var(--text); border-radius: 2px; transition: all .3s; }
    .burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .burger.open span:nth-child(2) { opacity: 0; }
    .burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .mobile-menu {
      display: none; position: fixed; top: 56px; left: 0; right: 0; bottom: 0; z-index: 150;
      background: rgba(7,7,15,.98); backdrop-filter: blur(20px);
      flex-direction: column; align-items: center; justify-content: center; gap: 32px;
      border-top: 1px solid var(--border);
    }
    .mobile-menu.open { display: flex; }
    .mobile-menu a { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 4px; color: var(--muted); text-decoration: none; transition: color .2s; }
    .mobile-menu a:hover, .mobile-menu a.active { color: var(--accent); }
    @media(max-width: 768px) {
      nav { padding: 0 20px; }
      .nav-links { display: none; }
      .burger { display: flex; }
    }

    /* ── DROPDOWN ── */
    .nav-dropdown { position: relative; }
    .nav-dropdown > a { cursor: pointer; }
    .dropdown-menu {
      position: absolute; top: 100%; left: 50%;
      padding-top: 14px; /* невидимий міст між кнопкою і меню */
      transform: translateX(-50%);
      opacity: 0; pointer-events: none;
      transition: opacity .2s, transform .2s;
      z-index: 500;
    }
    .dropdown-menu-inner {
      background: rgba(7,7,15,.98); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 0; min-width: 170px;
      backdrop-filter: blur(14px);
      transform: translateY(-6px); transition: transform .2s;
    }
    .nav-dropdown:hover .dropdown-menu {
      opacity: 1; pointer-events: all;
    }
    .nav-dropdown:hover .dropdown-menu-inner {
      transform: translateY(0);
    }
    .dropdown-menu a {
      display: block; padding: 10px 18px;
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: var(--muted); text-decoration: none; border-bottom: none !important;
      transition: color .15s, background .15s; white-space: nowrap;
    }
    .dropdown-menu a:hover { color: var(--text); background: rgba(145,70,255,.08); }
    .dropdown-menu a.active { color: var(--accent); }
    .nav-dropdown > a.dropdown-active { color: var(--accent); border-bottom-color: var(--accent) !important; }

    /* ══════════ MOBILE SCRIPTS ══════════ */
    @media(max-width:600px){
      .scripts-grid { grid-template-columns:1fr; }
    }
    @media(max-width:480px){
      .script-card-body { padding:12px 14px 14px; }
      .page { padding: 76px 14px 40px; }
      nav { padding:0 14px; }
      footer { padding:18px 14px; }
    }

    /* ══════════ ADMIN EDIT ══════════ */
    .script-card {
      position: relative;
    }
    .script-card-edit-btn {
      position: absolute; top: 8px; right: 8px;
      background: rgba(255,165,0,.15); border: 1px solid rgba(255,165,0,.4);
      color: #ffa500; padding: 4px 8px; font-size: 10px; border-radius: 3px;
      cursor: pointer; transition: all .2s; opacity: 0; pointer-events: none;
    }
    .script-card:hover .script-card-edit-btn {
      opacity: 1; pointer-events: all;
    }
    .script-card-edit-btn:hover { background: rgba(255,165,0,.25); border-color: rgba(255,165,0,.6); }

    /* ── EDIT MODAL ── */
    .edit-modal-backdrop {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(7,7,15,.92); backdrop-filter: blur(8px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .edit-modal-backdrop.open { display: flex; }

    .edit-modal {
      background: #0e0e20; border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 580px;
      transform: translateY(20px) scale(.97); transition: transform .25s;
      max-height: 92vh; overflow-y: auto;
    }
    .edit-modal-backdrop.open .edit-modal { transform: translateY(0) scale(1); }

    .edit-modal-header {
      padding: 20px 24px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .edit-modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 3px; color: var(--text); }
    .edit-modal-close {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      color: var(--muted); cursor: pointer; padding: 4px 8px; font-size: 16px;
      transition: border-color .15s, color .15s;
    }
    .edit-modal-close:hover { border-color: var(--accent); color: var(--accent); }

    .edit-modal-body { padding: 20px 24px; }

    .edit-form-group {
      margin-bottom: 18px;
    }
    .edit-form-label {
      display: block; font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 2px; color: var(--muted); margin-bottom: 6px;
    }
    .edit-form-input, .edit-form-textarea {
      width: 100%; padding: 10px 12px; background: rgba(255,255,255,.03); border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-family: 'Rajdhani', sans-serif; font-size: 14px;
      transition: border-color .15s;
    }
    .edit-form-textarea { resize: vertical; min-height: 80px; }
    .edit-form-input:focus, .edit-form-textarea:focus {
      outline: none; border-color: var(--accent);
    }

    .edit-form-actions {
      display: flex; gap: 10px; margin-top: 24px;
    }
    .edit-form-btn {
      flex: 1; padding: 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px;
      letter-spacing: 2px; border: 1px solid var(--border); border-radius: 6px;
      cursor: pointer; transition: border-color .15s, color .15s;
    }
    .edit-form-btn-save { background: rgba(0,200,100,.15); color: var(--green); border-color: rgba(0,200,100,.35); }
    .edit-form-btn-save:hover { border-color: rgba(0,200,100,.6); }
    .edit-form-btn-cancel { background: transparent; color: var(--muted); }
    .edit-form-btn-cancel:hover { border-color: var(--accent); color: var(--accent); }
    .edit-form-btn-delete { background: rgba(255,70,85,.08); color: #ff4655; border-color: rgba(255,70,85,.35); }
    .edit-form-btn-delete:hover { border-color: rgba(255,70,85,.6); }

    .admin-edit-btn {
      font-size: 11px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      background: rgba(255,165,0,.15); border: 1px solid rgba(255,165,0,.4);
      color: #ffa500; padding: 8px 14px; border-radius: 4px; cursor: pointer;
      transition: color .2s, border-color .2s;
    }
    .admin-edit-btn:hover { color: #ffb84d; border-color: rgba(255,165,0,.6); }


    @media(max-width:380px){
      .mobile-menu a { font-size:26px; letter-spacing:2px; }
      .mobile-menu { gap:20px; }
    }

  </style>
</head>

<!-- ═══ МОДАЛЬНЕ ВІКНО ДЛЯ РЕДАГУВАННЯ ═══ -->
<div class="edit-modal-backdrop" id="scriptModal">
  <div class="edit-modal">
    <div class="edit-modal-header">
      <div class="edit-modal-title">Редагування скрипту</div>
      <button class="edit-modal-close" id="closeScriptModal">✕</button>
    </div>
    <div class="edit-modal-body">
      <form id="scriptForm">
        <div class="edit-form-group">
          <label class="edit-form-label">НАЗВА СКРИПТУ</label>
          <input type="text" id="scriptName" class="edit-form-input" required>
        </div>
        <div class="edit-form-group">
          <label class="edit-form-label">ОПИС</label>
          <textarea id="scriptDesc" class="edit-form-textarea" placeholder="Коротко опиши що робить скрипт..."></textarea>
        </div>
        <div class="edit-form-group">
          <label class="edit-form-label">URL ЗОБРАЖЕННЯ</label>
          <input type="url" id="scriptImg" class="edit-form-input" required>
        </div>
        <div class="edit-form-group">
          <label class="edit-form-label">URL ЗАВАНТАЖЕННЯ</label>
          <input type="url" id="scriptUrl" class="edit-form-input" required>
        </div>
        <div class="edit-form-actions">
          <button type="submit" class="edit-form-btn edit-form-btn-save">ЗБЕРЕГТИ</button>
          <button type="button" class="edit-form-btn edit-form-btn-cancel" id="cancelScriptEdit">СКАСУВАТИ</button>
          <button type="button" class="edit-form-btn edit-form-btn-delete" id="deleteScriptBtn" style="display: none;">ВИДАЛИТИ</button>
        </div>
      </form>
    </div>
  </div>
</div>

<footer>❤️ © 24.04.2026 <strong>sun69wukong</strong> ❤️</footer>

<script>
  // ▼▼▼ УПРАВЛІННЯ СКРИПТАМИ ▼▼▼
  
  let currentScripts = [];
  let editingScriptId = null;
  const container = document.getElementById('scripts-container');
  const adminPanel = document.getElementById('admin-panel');
  const scriptModal = document.getElementById('scriptModal');
  const scriptForm = document.getElementById('scriptForm');
  const closeBtn = document.getElementById('closeScriptModal');
  const cancelBtn = document.getElementById('cancelScriptEdit');
  const deleteBtn = document.getElementById('deleteScriptBtn');
  const addBtn = document.getElementById('add-script-btn');

  // Завантажити скрипти
  async function loadScripts() {
    try {
      // Спочатку спробуємо завантажити з GitHub
      const scripts = await GitHubManager.getScripts();
      if (scripts.length > 0) {
        currentScripts = scripts;
      } else {
        // Якщо на GitHub немає — використовуємо стандартні
        currentScripts = await getDefaultScripts();
      }
    } catch (error) {
      console.warn('Не вдалось завантажити з GitHub, використовуємо стандартні:', error);
      currentScripts = await getDefaultScripts();
    }
    renderScripts();
    updateAdminPanel();
  }

  // Отримати стандартні скрипти
  async function getDefaultScripts() {
    return [
      {
        name: "TranslateJoin",
        desc: "Автоматично перекладає повідомлення при підключенні до чату.",
        img:  "https://futurenow.com.ua/wp-content/uploads/2020/04/bezkoshtovnyj-perekladach-onlajn.jpg",
        url:  "https://drive.usercontent.google.com/download?id=1XqMbLJizgidnrT9vkhah6eZ8H-ii2HYg&export=download&authuser=0"
      },
      {
        name: "Всі алерти в одному",
        desc: "Дозволяє робити всі алерти в одному скрипті і сповіщувати в обс студіо",
        img:  "https://media.discordapp.net/attachments/1493233309197799425/1497179922676846672/image.png?ex=69ec94f5&is=69eb4375&hm=a37007b3532d1031fbdf48b701f38310f53fe7dda35b3cbf9c3d061ed4ab8df6&=&format=webp&quality=lossless",
        url:  "https://drive.usercontent.google.com/download?id=1iF5K7SyknIS-ZERPHGmQcrinrgG2ThcF&export=download&authuser=0"
      },
      {
        name: "BanMax",
        desc: "Блокує будь який сайт який вказаний в розширенні.",
        img:  "https://store-images.s-microsoft.com/image/apps.31757.4afafa17-ff84-41b4-89d5-6315b95b8fe9.8a6f95ce-76a3-4527-a2e4-0523aeb1f22a.aaee099d-a09a-4793-8341-3d12e84362aa?mode=scale&h=100&q=90&w=100",
        url:  "https://microsoftedge.microsoft.com/addons/detail/banmax/pcmldmdhlebmpggcganlnjmlkkfmdhjn"
      },
      {
        name: "Clip",
        desc: "Створіть кліп за допомогою Stremerbot лиш вівши !clip name",
        img:  "https://media.discordapp.net/attachments/1249396967537250446/1497504042287366174/image.png?ex=69edc2d1&is=69ec7151&hm=39e43ace338f36575608b682091316ddd15cb0d8c7f035c7577e6efac5146d95&=&format=webp&quality=lossless",
        url:  "https://drive.usercontent.google.com/download?id=1MJavd6CrPYooDmwwfQtme6ulDAYfY4xI&export=download&authuser=0&confirm=t&uuid=c9ae5dad-2fdc-4965-a1e0-990a302227d8&at=ALBwUgn9FCM7o0udsR24U25rt533:1777103091017"
      },
      {
        name: "ЗМІНА КАТЕГОРІЇ",
        desc: "Зміна категорії і зміна сцени і назву стірма за доп AI",
        img:  "https://media.discordapp.net/attachments/1249396967537250446/1497505083238125598/image.png?ex=69edc3ca&is=69ec724a&hm=bdaded8ab38ac67baa254895c59416c56340043a7c00ec8d0639c0eb1d658840&=&format=webp&quality=lossless",
        url:  "https://drive.usercontent.google.com/download?id=1egfqGhPjiPnHIUOlgCC6f092e7Kx1KCp&export=download&authuser=0&confirm=t&uuid=4eebe9f2-d7b2-4cb7-85e2-30cb0eb67777&at=ALBwUgkD7SwlemHEzWzDqotrIQwp:1777103327582"
      },
    ];
  }

  // Відобразити скрипти
  function renderScripts() {
    container.innerHTML = currentScripts.map(s => `
      <div class="script-card" data-id="${s.id || 0}">
        <img src="${s.img}" alt="${s.name}">
        ${TwitchAuth.isOwner() ? `<button class="script-card-edit-btn" onclick="editScript(${s.id || 0})">✏ EDIT</button>` : ''}
        <div class="script-card-body">
          <div class="script-card-header">
            <div class="script-name">${s.name}</div>
          </div>
          ${s.desc ? `<p class="script-desc">${s.desc}</p>` : ''}
          <a class="script-dl" href="${s.url}" target="_blank">↓ ЗАВАНТАЖИТИ</a>
        </div>
      </div>
    `).join('');
  }

  // Оновити адмін панель
  function updateAdminPanel() {
    if (TwitchAuth.isOwner()) {
      adminPanel.style.display = 'block';
    } else {
      adminPanel.style.display = 'none';
    }
  }

  // Редагування скрипту
  window.editScript = function(id) {
    editingScriptId = id;
    const script = id === 0 ? null : currentScripts.find(s => s.id === id);
    
    if (script) {
      document.getElementById('scriptName').value = script.name;
      document.getElementById('scriptDesc').value = script.desc || '';
      document.getElementById('scriptImg').value = script.img;
      document.getElementById('scriptUrl').value = script.url;
      deleteBtn.style.display = 'block';
      scriptForm.querySelector('.edit-modal-title') = 'Редагування скрипту';
    } else {
      document.getElementById('scriptName').value = '';
      document.getElementById('scriptDesc').value = '';
      document.getElementById('scriptImg').value = '';
      document.getElementById('scriptUrl').value = '';
      deleteBtn.style.display = 'none';
      editingScriptId = null;
    }
    
    scriptModal.classList.add('open');
  };

  // Додати новий скрипт
  addBtn?.addEventListener('click', () => {
    editingScriptId = null;
    document.getElementById('scriptName').value = '';
    document.getElementById('scriptDesc').value = '';
    document.getElementById('scriptImg').value = '';
    document.getElementById('scriptUrl').value = '';
    deleteBtn.style.display = 'none';
    scriptModal.classList.add('open');
  });

  // Закрити модаль
  closeBtn?.addEventListener('click', () => {
    scriptModal.classList.remove('open');
  });

  cancelBtn?.addEventListener('click', () => {
    scriptModal.classList.remove('open');
  });

  // Відправка форми
  scriptForm?.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (!GitHubManager.config.token) {
      alert('GitHub токен не встановлений! Введіть токен для збереження.');
      return;
    }

    const scriptData = {
      name: document.getElementById('scriptName').value,
      desc: document.getElementById('scriptDesc').value,
      img: document.getElementById('scriptImg').value,
      url: document.getElementById('scriptUrl').value,
    };

    try {
      if (editingScriptId) {
        // Оновити існуючий
        currentScripts = await GitHubManager.updateScript(editingScriptId, scriptData);
      } else {
        // Додати новий
        currentScripts = await GitHubManager.addScript(scriptData);
      }
      
      renderScripts();
      scriptModal.classList.remove('open');
      alert('Скрипт збережений!');
    } catch (error) {
      alert('Помилка при збереженні: ' + error.message);
    }
  });

  // Видалення скрипту
  deleteBtn?.addEventListener('click', async () => {
    if (!confirm('Ви впевнені що хочете видалити цей скрипт?')) return;

    try {
      currentScripts = await GitHubManager.deleteScript(editingScriptId);
      renderScripts();
      scriptModal.classList.remove('open');
      alert('Скрипт видалений!');
    } catch (error) {
      alert('Помилка при видаленні: ' + error.message);
    }
  });

  // Запитати токен при першому завантаженні
  if (TwitchAuth.isOwner() && !GitHubManager.config.token) {
    const token = prompt('Введіть GitHub Personal Access Token:\n(Токен буде збережений локально)');
    if (token) {
      GitHubManager.setToken(token);
    }
  }

  // Завантажити скрипти при завантаженні сторінки
  document.addEventListener('DOMContentLoaded', loadScripts);
</script>

<script>
  const _burger = document.getElementById('burger');
  const _mobileMenu = document.getElementById('mobileMenu');
  if (_burger && _mobileMenu) {
    _burger.addEventListener('click', () => {
      _burger.classList.toggle('open');
      _mobileMenu.classList.toggle('open');
    });
    _mobileMenu.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => {
        _burger.classList.remove('open');
        _mobileMenu.classList.remove('open');
      });
    });
  }
</script>

<script src="editor.js?v=1"></script>
</body>
